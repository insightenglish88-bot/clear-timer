<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="iconChrono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#iconBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Crown Pusher -->
  <rect x="29" y="4" width="6" height="4.5" rx="1.5" fill="#64748B" />
  <rect x="27" y="3" width="10" height="2" rx="1" fill="#94A3B8" />

  <!-- Left & Right Angular Pushers -->
  <rect x="46" y="10" width="4" height="3" rx="1" transform="rotate(35 48 11.5)" fill="#64748B" />
  <rect x="14" y="12" width="4" height="3" rx="1" transform="rotate(-35 16 13.5)" fill="#64748B" />

  <!-- Outer Gauge Track -->
  <circle cx="32" cy="34" r="20" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- Dynamic Glowing Progress Sweep Arc -->
  <path
    d="M 32 14 A 20 20 0 1 1 17 48"
    fill="none"
    stroke="url(#iconChrono)"
    stroke-width="3.5"
    stroke-linecap="round"
    filter="url(#iconGlow)"
  />

  <!-- Tick Marks -->
  <line x1="32" y1="17" x2="32" y2="19.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="49" y1="34" x2="46.5" y2="34" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="51" x2="32" y2="48.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="15" y1="34" x2="17.5" y2="34" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Pivot Core -->
  <circle cx="32" cy="34" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

  <!-- Precision Stopwatch Needle -->
  <line x1="32" y1="34" x2="43" y2="22" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="43" cy="22" r="1.8" fill="#FFFFFF" filter="url(#iconGlow)" />
</svg>
