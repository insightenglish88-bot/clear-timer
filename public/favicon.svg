<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer precision chronometer ring gradient -->
    <linearGradient id="timerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Core needle and accent glow -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Stopwatch Top Pusher Crown -->
  <rect x="29" y="5" width="6" height="4" rx="1.5" fill="#64748B" />
  <rect x="27" y="4" width="10" height="2" rx="1" fill="#94A3B8" />

  <!-- Side Lap Pushers -->
  <rect x="46" y="11" width="4" height="3" rx="1" transform="rotate(35 48 12.5)" fill="#64748B" />
  <rect x="14" y="13" width="4" height="3" rx="1" transform="rotate(-35 16 14.5)" fill="#64748B" />

  <!-- Dial Outer Track (Muted) -->
  <circle cx="32" cy="35" r="21" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- Precision Progress Sweep Arc (Glowing Gradient) -->
  <path
    d="M 32 14 A 21 21 0 1 1 17 49.5"
    fill="none"
    stroke="url(#timerRing)"
    stroke-width="3.5"
    stroke-linecap="round"
    filter="url(#subtleGlow)"
  />

  <!-- Subtle Tick Marks -->
  <line x1="32" y1="17" x2="32" y2="19.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="35" x2="47.5" y2="35" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="53" x2="32" y2="50.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="14" y1="35" x2="16.5" y2="35" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Pivot Core -->
  <circle cx="32" cy="35" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

  <!-- Precision Stopwatch Needle pointing to 2 o'clock -->
  <line x1="32" y1="35" x2="43" y2="23" stroke="url(#needleGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Needle Tip Accent Glow Point -->
  <circle cx="43" cy="23" r="1.8" fill="#FFFFFF" filter="url(#subtleGlow)" />
</svg>
