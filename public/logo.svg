<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Background / Shadow gradients -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Vibrant Chronometer Gradient -->
    <linearGradient id="chronoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Wordmark Accent Gradient -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (Left) ================= -->
  <g transform="translate(10, 8)">
    <!-- Squircle Base Frame -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#emblemBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Crown Pusher -->
    <rect x="29" y="3" width="6" height="5" rx="1.5" fill="#64748B" />
    <rect x="27" y="2" width="10" height="2" rx="1" fill="#94A3B8" />

    <!-- Left & Right Angular Pushers -->
    <rect x="46.5" y="9.5" width="4" height="3" rx="1" transform="rotate(35 48 11)" fill="#64748B" />
    <rect x="13.5" y="11.5" width="4" height="3" rx="1" transform="rotate(-35 15 13)" fill="#64748B" />

    <!-- Outer Gauge Track -->
    <circle cx="32" cy="34" r="21" fill="none" stroke="#1E293B" stroke-width="3" />

    <!-- Dynamic Glowing Progress Sweep Arc -->
    <path
      d="M 32 13 A 21 21 0 1 1 17 48.5"
      fill="none"
      stroke="url(#chronoGradient)"
      stroke-width="3.5"
      stroke-linecap="round"
      filter="url(#logoGlow)"
    />

    <!-- Tick Marks -->
    <line x1="32" y1="16" x2="32" y2="18.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="50" y1="34" x2="47.5" y2="34" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="52" x2="32" y2="49.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="34" x2="16.5" y2="34" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />

    <!-- Center Pivot Core -->
    <circle cx="32" cy="34" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

    <!-- Precision Stopwatch Needle -->
    <line x1="32" y1="34" x2="44" y2="21" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="44" cy="21" r="2" fill="#FFFFFF" filter="url(#logoGlow)" />
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(90, 48)">
    <!-- "clear" bold gradient text -->
    <text
      x="0"
      y="0"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="34"
      letter-spacing="-1.2px"
      fill="url(#wordmarkGrad)"
    >clear</text>

    <!-- "timer" clean white text -->
    <text
      x="88"
      y="0"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="700"
      font-size="34"
      letter-spacing="-0.8px"
      fill="#F8FAFC"
    >timer</text>

    <!-- Subtitle / Brand Tagline -->
    <text
      x="2"
      y="18"
      font-family="'JetBrains Mono', monospace"
      font-weight="600"
      font-size="10"
      letter-spacing="1.5px"
      text-transform="uppercase"
      fill="#94A3B8"
    >PRECISION TIMING</text>
  </g>
</svg>
